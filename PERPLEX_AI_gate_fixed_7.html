<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SignalPro">
<meta name="theme-color" content="#EAF5FC">
<meta name="format-detection" content="telephone=no">
<title>SignalPro Futures — Live Crypto Futures Signals</title>
<style>
:root{
  --bg:#EDF6FB;--surface:#FFFFFF;--surface2:#F5FAFD;--border:#D6E5EF;--border2:#E6EFF5;
  --text:#0D2A3C;--muted:#557086;--faint:#8AA2B4;
  --blue:#1A78D2;--blue-soft:#E2F0FC;--sky:#3FB0EC;
  --green:#0F9D63;--green-soft:#E1F6EC;--yellow:#D99A00;--yellow-soft:#FFF4D1;--yellow-hi:#FFC93C;
  --red:#D2455C;--red-soft:#FCEBEE;
  --r:16px;--r-sm:10px;
  --shadow:0 1px 2px rgba(13,42,60,.05),0 4px 14px rgba(13,42,60,.06);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.4;-webkit-text-size-adjust:100%}
body{min-height:100vh;overscroll-behavior-y:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font:inherit;font-size:16px;color:var(--text)}
.num{font-variant-numeric:tabular-nums}
a{color:var(--blue);text-decoration:none}

/* header */
.top{position:sticky;top:0;z-index:30;padding:calc(var(--safe-t) + 8px) 14px 8px;background:linear-gradient(180deg,#E3F2FC 0%,rgba(237,246,251,.96) 100%);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--border2)}
.top-row{display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px;letter-spacing:-.01em;flex:1;min-width:0}
.brand-mark{width:28px;height:28px;border-radius:9px;background:linear-gradient(135deg,var(--sky),var(--green) 60%,var(--yellow-hi));display:grid;place-items:center;color:#fff;font-size:14px;font-weight:900;flex-shrink:0}
.brand small{display:block;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:0}
.btn-refresh{display:flex;align-items:center;gap:6px;background:var(--blue);color:#fff;border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;box-shadow:0 2px 8px rgba(26,120,210,.3);min-height:38px}
.btn-refresh:active{transform:scale(.97)}
.btn-refresh svg{width:16px;height:16px}
.btn-refresh.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.icon-btn{width:38px;height:38px;border-radius:999px;background:var(--surface);border:1px solid var(--border);display:grid;place-items:center;position:relative}
.icon-btn svg{width:18px;height:18px}
.icon-btn .dot{position:absolute;top:6px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--green);border:2px solid #fff}
.icon-btn .dot.off{background:var(--faint)}
.ex-row{display:flex;gap:6px;margin-top:8px;align-items:center;flex-wrap:wrap}
.ex{display:flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:3px 9px;color:var(--muted)}
.ex i{width:7px;height:7px;border-radius:50%;background:var(--faint);display:inline-block}
.ex.up i{background:var(--green);box-shadow:0 0 0 3px rgba(15,157,99,.15)}
.ex.down i{background:var(--red)}
.ex.wait i{background:var(--yellow)}
.status-txt{margin-left:auto;font-size:11.5px;color:var(--muted)}
.progress{height:3px;background:transparent;margin:6px -14px -8px;overflow:hidden}
.progress b{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--sky),var(--green),var(--yellow-hi));transition:width .3s}

main{padding:12px 12px calc(84px + var(--safe-b));max-width:760px;margin:0 auto}
.page{display:none}
.page.active{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:.4}to{opacity:1}}
h2.sec{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:20px 4px 8px;font-weight:700;display:flex;align-items:center;gap:8px}
h2.sec .tag{text-transform:none;letter-spacing:0;font-weight:600;font-size:11px;background:var(--blue-soft);color:var(--blue);padding:2px 8px;border-radius:999px}
.card{background:var(--surface);border:1px solid var(--border2);border-radius:var(--r);box-shadow:var(--shadow);padding:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.kpi{background:var(--surface);border:1px solid var(--border2);border-radius:14px;padding:10px 11px;box-shadow:var(--shadow);min-width:0}
.kpi .l{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.kpi .v{font-size:17px;font-weight:800;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:11.5px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bull{color:var(--green)}.bear{color:var(--red)}.neu{color:var(--yellow)}
.advice{margin-top:8px;border-radius:14px;padding:12px 13px;font-size:14px;line-height:1.45;border:1px solid}
.advice b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
.advice.g{background:var(--green-soft);border-color:#BFE9D3}
.advice.r{background:var(--red-soft);border-color:#F4C9D1}
.advice.y{background:var(--yellow-soft);border-color:#F5DE96}
.advice.b{background:var(--blue-soft);border-color:#BFDDF6}

/* pick cards */
.main-pick{position:relative;overflow:hidden;padding:16px}
.main-pick:before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:linear-gradient(90deg,var(--sky),var(--green),var(--yellow-hi))}
.pick-head{display:flex;align-items:center;gap:12px}
.coin-ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:13px;color:#fff;flex-shrink:0;letter-spacing:-.02em}
.pick-name{flex:1;min-width:0}
.pick-name .t{font-size:20px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pick-name .p{font-size:13px;color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:999px;letter-spacing:.02em;white-space:nowrap}
.badge.long{background:var(--green-soft);color:var(--green)}
.badge.short{background:var(--red-soft);color:var(--red)}
.badge.wait{background:var(--yellow-soft);color:#9A6D00}
.badge.blue{background:var(--blue-soft);color:var(--blue)}
.badge.grade{background:#E8F7F0;color:var(--green);border:1px solid #BFE9D3}
.ring{width:66px;height:66px;position:relative;flex-shrink:0}
.ring svg{width:66px;height:66px;transform:rotate(-90deg)}
.ring .rv{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-weight:800;font-size:16px;line-height:1}
.ring .rv small{display:block;font-size:9px;color:var(--muted);font-weight:700;margin-top:2px;letter-spacing:.04em}
.lv{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
.lv div{background:var(--surface2);border:1px solid var(--border2);border-radius:10px;padding:7px 8px;min-width:0}
.lv span{display:block;font-size:10.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.lv b{display:block;font-size:13.5px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mtf{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:10px}
.mtf div{text-align:center;border-radius:9px;padding:5px 2px;font-size:11px;font-weight:700;background:var(--surface2);border:1px solid var(--border2)}
.mtf div em{display:block;font-style:normal;font-size:10px;color:var(--muted);font-weight:600}
.mtf .u{background:var(--green-soft);color:var(--green);border-color:#C9EEDB}
.mtf .d{background:var(--red-soft);color:var(--red);border-color:#F6D3D9}
.mtf .n{background:var(--yellow-soft);color:#9A6D00;border-color:#F5E2A6}
.reasons{margin:12px 0 0;padding:0;list-style:none;font-size:13.5px}
.reasons li{padding:5px 0 5px 22px;position:relative;border-top:1px dashed var(--border2)}
.reasons li:first-child{border-top:0}
.reasons li:before{content:"";position:absolute;left:4px;top:11px;width:8px;height:8px;border-radius:50%;background:var(--sky)}
.reasons li.ok:before{background:var(--green)}
.reasons li.bad:before{background:var(--red)}
.reasons li.warn:before{background:var(--yellow-hi)}
.row-btns{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;border-radius:12px;padding:10px 12px;font-weight:700;font-size:14px;background:var(--blue-soft);color:var(--blue);text-align:center;min-height:42px}
.btn.solid{background:var(--blue);color:#fff}
.btn.green{background:var(--green);color:#fff}
.btn.ghost{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
.btn:active{transform:scale(.98)}
.alt-list{display:grid;gap:8px}
.alt{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:11px 12px;cursor:pointer}
.alt .coin-ico{width:36px;height:36px;font-size:11.5px;border-radius:10px}
.alt .nm{font-weight:800;font-size:15px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.alt .sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.alt .wc{text-align:right;font-weight:800;font-size:17px}
.alt .wc small{display:block;font-size:10.5px;color:var(--muted);font-weight:600}
.rank{font-size:11px;font-weight:800;color:var(--muted);width:18px;text-align:center}

/* table */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:var(--r);border:1px solid var(--border2);background:var(--surface);box-shadow:var(--shadow)}
table.t{width:100%;border-collapse:collapse;font-size:12.5px;min-width:620px}
table.t th{position:sticky;top:0;background:var(--surface2);color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;text-align:left;padding:8px 6px;font-weight:700;border-bottom:1px solid var(--border2);white-space:nowrap}
table.t td{padding:8px 6px;border-bottom:1px solid var(--border2);white-space:nowrap;vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
table.t td:first-child,table.t th:first-child{position:sticky;left:0;background:var(--surface);z-index:1;font-weight:800;padding-left:10px}
table.t th:first-child{background:var(--surface2);z-index:2}
table.t tbody tr{cursor:pointer}
table.t tbody tr:active td{background:var(--blue-soft)}
.cell{display:inline-flex;flex-direction:column;line-height:1.15}
.cell small{font-size:10px;color:var(--muted)}
.arr{font-weight:800}
.empty{padding:26px 16px;text-align:center;color:var(--muted);font-size:14px}
.skel{background:linear-gradient(90deg,#EAF2F8 25%,#F6FAFD 50%,#EAF2F8 75%);background-size:200% 100%;animation:sh 1.3s infinite;border-radius:12px}
@keyframes sh{to{background-position:-200% 0}}

/* bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px calc(6px + var(--safe-b))}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:700;color:var(--faint);padding:4px 0;min-height:48px;justify-content:center}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--blue)}
nav.tabs button.on svg{stroke:var(--blue)}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(13,42,60,.35);z-index:60;display:none}
.sheet-bg.show{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--bg);border-radius:20px 20px 0 0;max-height:92vh;overflow-y:auto;-webkit-overflow-scrolling:touch;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);padding:0 12px calc(20px + var(--safe-b));max-width:760px;margin:0 auto}
.sheet.show{transform:none}
.sheet-head{position:sticky;top:0;background:var(--bg);padding:10px 4px 8px;z-index:2;display:flex;align-items:center;gap:8px}
.sheet-head .grab{position:absolute;top:5px;left:50%;width:40px;height:4px;border-radius:4px;background:var(--border);transform:translateX(-50%)}
.sheet-head h3{margin:8px 0 0;font-size:18px;flex:1}
.close{width:34px;height:34px;border-radius:50%;background:var(--surface);border:1px solid var(--border);display:grid;place-items:center;margin-top:8px;font-size:18px}

/* alarm modal */
.alarm{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(13,42,60,.45)}
.alarm.show{display:flex}
.alarm .box{background:var(--surface);border-radius:22px;max-width:380px;width:100%;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.25);border:2px solid var(--yellow-hi);animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.8);opacity:0}}
.alarm h4{margin:0 0 4px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:#9A6D00}
.toast{position:fixed;left:50%;top:calc(var(--safe-t) + 70px);transform:translateX(-50%) translateY(-20px);background:var(--text);color:#fff;padding:9px 16px;border-radius:999px;font-size:13px;font-weight:600;z-index:90;opacity:0;pointer-events:none;transition:.25s;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* radar */
.radar-box{display:grid;grid-template-columns:1fr;gap:8px}
.radar-svg{width:100%;max-width:400px;display:block;margin:0 auto}
.bars{display:flex;align-items:flex-end;gap:6px;height:110px;padding-top:6px}
.bars .bc{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:3px;min-width:0}
.bars .b{width:100%;border-radius:6px 6px 3px 3px;min-height:4px}
.bars small{font-size:10px;color:var(--muted);white-space:nowrap}
.bars .bv{font-size:11px;font-weight:800}
.meter{height:10px;border-radius:999px;background:linear-gradient(90deg,var(--red),var(--yellow-hi) 50%,var(--green));position:relative;margin:8px 0 4px}
.meter i{position:absolute;top:-4px;width:4px;height:18px;border-radius:3px;background:var(--text);transform:translateX(-50%);box-shadow:0 0 0 2px #fff}
.meter.risk{background:linear-gradient(90deg,var(--green),var(--yellow-hi) 50%,var(--red))}
.news-item{display:block;padding:10px 0;border-top:1px solid var(--border2);color:var(--text)}
.news-item:first-child{border-top:0;padding-top:0}
.news-item .h{font-size:14px;font-weight:600;line-height:1.35}
.news-item .m{font-size:11.5px;color:var(--muted);margin-top:3px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.chip{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--surface2);border:1px solid var(--border2);color:var(--muted)}
.chip.g{background:var(--green-soft);color:var(--green);border-color:#C9EEDB}
.chip.r{background:var(--red-soft);color:var(--red);border-color:#F6D3D9}
.chip.y{background:var(--yellow-soft);color:#9A6D00;border-color:#F5E2A6}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.form-row{display:flex;gap:8px;flex-wrap:wrap}
.form-row>*{flex:1;min-width:0}
.inp{width:100%;border:1px solid var(--border);background:var(--surface);border-radius:12px;padding:10px 12px;min-height:44px;outline:none}
.inp:focus{border-color:var(--sky);box-shadow:0 0 0 3px rgba(63,176,236,.2)}
.ai-out{margin-top:12px;font-size:14px;line-height:1.55}
.ai-out h5{margin:14px 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.ai-out p{margin:6px 0}
.chat{display:flex;flex-direction:column;gap:8px;margin-top:10px;max-height:none}
.msg{padding:10px 12px;border-radius:14px;font-size:14px;line-height:1.5;max-width:94%}
.msg.u{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:var(--surface2);border:1px solid var(--border2);border-bottom-left-radius:4px}
.msg.a p{margin:4px 0}
.small{font-size:12px;color:var(--muted)}
.mini-tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.mini-tbl td,.mini-tbl th{padding:6px 4px;border-bottom:1px solid var(--border2);text-align:left}
.mini-tbl th{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.mini-tbl tr:last-child td{border-bottom:0}
.seg{display:flex;background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:7px 4px;border-radius:9px;font-size:13px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--blue);box-shadow:var(--shadow)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--border2);font-size:14px}
.switch:first-child{border-top:0}
.tgl{width:48px;height:28px;border-radius:999px;background:var(--border);position:relative;flex-shrink:0;transition:.2s}
.tgl:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:.2s}
.tgl.on{background:var(--green)}
.tgl.on:after{left:23px}
.disclaimer{font-size:11.5px;color:var(--faint);text-align:center;margin:22px 8px 6px;line-height:1.5}
.check-grid{display:grid;gap:4px;margin-top:8px}
.ck{display:flex;gap:8px;align-items:flex-start;font-size:13px;padding:6px 8px;border-radius:9px;background:var(--surface2)}
.ck b{flex-shrink:0;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;color:#fff;margin-top:1px}
.ck.p b{background:var(--green)}.ck.f b{background:var(--red)}
.ck span small{display:block;color:var(--muted);font-size:11.5px}
@media (min-width:640px){.radar-box{grid-template-columns:1fr 1fr}}
@media (max-width:360px){.lv{grid-template-columns:repeat(2,1fr)}.grid3{grid-template-columns:repeat(2,1fr)}}
.flash{animation:flash .8s ease}@keyframes flash{0%{background:rgba(242,183,5,.35)}100%{background:transparent}}

/* bot / page 5 */
.bot-master{display:flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;padding:14px;font-weight:800;font-size:16px;min-height:52px;width:100%;letter-spacing:.01em}
.bot-master.on{background:linear-gradient(135deg,#0F9D63,#0B7A4C);color:#fff;box-shadow:0 4px 14px rgba(15,157,99,.35)}
.bot-master.off{background:var(--surface2);color:var(--muted);border:1px solid var(--border)}
.bot-master.live{background:linear-gradient(135deg,#D2455C,#A33247);color:#fff;box-shadow:0 4px 14px rgba(210,69,92,.35)}
.trade-card{position:relative;overflow:hidden}
.trade-card:before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:linear-gradient(90deg,var(--sky),var(--green))}
.cand{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;background:var(--surface2);border:1px solid var(--border2)}
.cand.win{border-color:#BFE9D3;background:var(--green-soft)}
.cand .wc{font-weight:800;font-size:15px}
.cand .wc small{display:block;font-size:10.5px;color:var(--muted);font-weight:600}
.zone-band{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:12px;border:1px solid var(--border2);background:var(--surface2)}
.stat-line{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;padding:6px 0;border-top:1px dashed var(--border2)}
.stat-line:first-of-type{border-top:0}
.stat-line b{white-space:nowrap}
</style>
</head>
<body>
<header class="top">
  <div class="top-row">
    <div class="brand"><div class="brand-mark">S</div><div>SignalPro Futures<small id="clock">Live · USDT perpetuals</small></div></div>

const _symCache={};

function classifyMove(R,chg){
  const mv=R.snap.mv;const cr=S.crowd[R.b]||{};const up=chg>0;
  const fade=mv.peakQ?mv.nowQ/mv.peakQ:1;const pos=(R.price-mv.lo)/((mv.hi-mv.lo)||1);
  const held=up?mv.heldUp:mv.heldDn;
  const chk=[];const add=(p,t)=>chk.push({p,t});
  add(cr.oiChg==null?null:(up?cr.oiChg>3:cr.oiChg>3),cr.oiChg==null?'Open interest n/a':`Open interest ${fpct(cr.oiChg,1)} in 24h (${cr.oiChg>3?'new money entering':'no new positions — squeeze/flush only'})`);
  add(cr.taker==null?null:(up?cr.taker>=1:cr.taker<=1),cr.taker==null?'Taker flow n/a':`Taker buy/sell ${cr.taker.toFixed(2)} last 4h`);
  add(fade>.3,`Volume now ${(fade*100).toFixed(0)}% of peak hour (${fade>.3?'still active':'fading'})`);
  add(up?pos>.6:pos<.4,`Price at ${(pos*100).toFixed(0)}% of 24h range`);
  add(up?R.tf['1h'].rsi<85:R.tf['1h'].rsi>15,`RSI 1h ${R.tf['1h'].rsi.toFixed(0)}`);
  add(held,`${held?'Holding':'Lost'} EMA20 on last 3 hourly closes`);
  add((R.ag&&R.ag.spread||0)<.6,`Cross-exchange spread ${(R.ag&&R.ag.spread||0).toFixed(2)}%`);
  const valid=chk.filter(x=>x.p!==null);const good=valid.filter(x=>x.p).length;const ratio=valid.length?good/valid.length:.5;
  const real=ratio>=.68,fake=ratio<=.43;
  const label=up?(real?'Real pump':fake?'Fake / exhausted pump':'Mixed pump'):(real?'Real dump':fake?'Dump exhausted (bounce risk)':'Mixed dump');
  const moveDir=up?1:-1;const fakeAgainst=(real&&R.lean!==moveDir)||(fake&&R.lean===moveDir);
  R.pump={chg,label,real,fake,ratio,chk,fakeAgainst,why:`${good}/${valid.length} momentum-quality checks`}}

/* ---------------- self-learning engine ----------------
   Every live signal is recorded, graded against the REAL price 4h later,
   and the model corrects itself after every mistake:
   - per-coin trust: coins it called wrong lose win chance and rank
   - per-timeframe weights: TFs that predicted well get more weight in the composite
   - win-chance components (rule backtest / analog / TF agreement) re-weight by gradient
   - global calibration: predicted % is scaled to match realized hit rate
   - closed paper trades feed the same loop. State persists in localStorage. */
const LEARN_H=4*36e5;
const LEARN_KEY='csp_learn_v1';
S.learn=Object.assign({preds:[],tf:{},coin:{},w:{bt:.42,an:.33,agree:.25},cal:1,st:{n:0,hit:0,win:0}},lsGet(LEARN_KEY,{}));
if(!S.learn.w||!S.learn.w.bt)S.learn.w={bt:.42,an:.33,agree:.25};
if(!S.learn.st)S.learn.st={n:0,hit:0,win:0};
if(!S.learn.cs)S.learn.cs={n:0,hit:0,raw:0}; // calibration counters: raw (uncalibrated) win chance vs real outcome
function learnSave(){lsSet(LEARN_KEY,S.learn)}
function learnRecord(R){
  if(R.dir===0)return;const L=S.learn;
  const rec={b:R.b,dir:R.dir,win:R.win,raw:R.winRaw,px:R.price,t:Date.now(),
    x:{bt:R.btScore,an:R.pAn==null?.5:R.pAn,agree:.35+.35*(R.agreeW||0)},
    tf:Object.fromEntries(TFS.filter(t=>R.tf&&R.tf[t]).map(t=>[t,R.tf[t].dir||sgn(R.tf[t].s)||0]))};
  const i=L.preds.findIndex(p=>p.b===R.b);
  if(i>=0){const o=L.preds[i];if(o.dir===rec.dir&&Date.now()-o.t<LEARN_H)return;L.preds[i]=rec}
  else{L.preds.push(rec);if(L.preds.length>400)L.preds.shift()}
  learnSave()}
let learnBusy=false;
async function learnEvaluate(){
  if(learnBusy)return;learnBusy=true;
  try{
    const L=S.learn;const now=Date.now();let ch=false;let fetched=0;
    for(const p of[...L.preds]){
      if(now-p.t<LEARN_H)continue;
      if(now-p.t>48*36e5){L.preds=L.preds.filter(x=>x!==p);continue}
      let px=null;
      try{const K=await klines(p.b,'1h',true);fetched++;
        for(const c of K.c){if(c.t>=p.t+LEARN_H){px=c.o;break}}
        if(px==null){const lc=K.c[K.c.length-1];if(!lc||lc.t<p.t+LEARN_H)continue;px=lc.c}}catch(e){}
      if(px==null||!isFinite(px)||px<=0){ // a live price is only a fair 4h grade if it is recent; otherwise drop the call
        if(now-p.t<LEARN_H+45*6e4)px=livePrice(p.b);else{L.preds=L.preds.filter(x=>x!==p);ch=true;continue}}
      if(px==null||!isFinite(px)||px<=0){continue}
      const up=px>p.px;const ok=(up&&p.dir>0)||(!up&&p.dir<0)?1:0;
      L.st.n++;L.st.hit+=ok;L.st.win+=p.win;
      {const cs=L.cs||(L.cs={n:0,hit:0,raw:0});cs.n++;cs.hit+=ok;cs.raw+=(p.raw!=null?p.raw:p.win)}
      const c=L.coin[p.b]||(L.coin[p.b]={n:0,hit:0});c.n++;c.hit+=ok;
      for(const t in p.tf){if(!p.tf[t])continue;const f=L.tf[t]||(L.tf[t]={n:0,hit:0});f.n++;f.hit+=(p.tf[t]>0)===up?1:0}
      // gradient step: correct the win-chance component weights using this mistake
      const e=ok-p.win;const W=L.w;let sum=0;
      for(const k in W){W[k]=clamp(W[k]+.05*e*(p.x[k]||0),.12,.65);sum+=W[k]}
      if(sum>0)for(const k in W)W[k]/=sum;
      L.preds=L.preds.filter(x=>x!==p);ch=true;
      if(fetched>=10)break}
    {const cs=L.cs;if(cs&&cs.n>=20){const real=cs.hit/cs.n,raw=cs.raw/cs.n,dev=raw-.5;let c=Math.abs(dev)>.03?(real-.5)/dev:1;const w=cs.n/(cs.n+60);c=1+(c-1)*w;L.cal=clamp(c,.6,1.25)}}
    if(ch)learnSave()}
  finally{learnBusy=false}}
function tfwL(t){const f=S.learn.tf[t];if(!f||f.n<25)return 1;const acc=f.hit/f.n;return clamp(.6+(acc-.5)*4,.5,1.6)}
function coinAdj(b){const c=S.learn.coin[b];if(!c||c.n<5)return 0;const r=(c.hit+2)/(c.n+4);return clamp((r-.5)*.5,-.18,.15)}
function learnPaper(x,st){if(st!=='win'&&st!=='loss')return;try{const L=S.learn;const ok=st==='win'?1:0;
  const c=L.coin[x.b]||(L.coin[x.b]={n:0,hit:0});c.n++;c.hit+=ok;L.st.n++;L.st.hit+=ok;L.st.win+=x.win||.5;const cs=L.cs||(L.cs={n:0,hit:0,raw:0});cs.n++;cs.hit+=ok;cs.raw+=(x.raw!=null?x.raw:(x.win||.5));learnSave()}catch(e){}}
function learnLine(R){
  const L=S.learn;const c=L.coin[R.b];const st=L.st;
  if(st.n<15&&(!c||c.n<3))return null;
  const parts=[];let cls='';
  if(c&&c.n>=3){const r=(c.hit+1)/(c.n+2);const adj=coinAdj(R.b);
    parts.push(`${c.n} tracked live calls on ${R.b}: ${c.hit} correct (${(r*100).toFixed(0)}%) — win chance ${adj>=0?'+':''}${(adj*100).toFixed(1)}%`);
    if(adj<-.03)cls='bad';else if(adj>.03)cls='ok'}
  if(st.n>=15)parts.push(`model calibration ×${L.cal.toFixed(2)} (predicted ${(st.win/st.n*100).toFixed(0)}% vs realized ${(st.hit/st.n*100).toFixed(0)}% over ${st.n} calls)`);
  return{c:cls,t:'Self-learning: '+parts.join(' · ')+'. Every past call is graded against the real 4h-later price and the model corrects itself.'}}
function learnHtml(){
  const L=S.learn;const st=L.st;const acc=st.n?st.hit/st.n:null;const pred=st.n?st.win/st.n:null;
  const rows=Object.entries(L.coin).filter(([,c])=>c.n>=4).map(([b,c])=>({b,n:c.n,r:c.hit/c.n})).sort((a,b)=>b.r-a.r);
  const shown=[...rows.slice(0,3),...rows.slice(-3).reverse()].filter((x,i,a)=>a.findIndex(y=>y.b===x.b)===i).slice(0,6);
  const tfRows=TFS.map(t=>{const f=L.tf[t];return f&&f.n>=10?`<span class="chip ${f.hit/f.n>=.5?'g':'r'}">${t} weight ×${tfwL(t).toFixed(2)} · ${(f.hit/f.n*100).toFixed(0)}% of ${f.n}</span>`:''}).filter(Boolean).join('');
  const kpis=`<div class="grid3" style="margin-bottom:10px"><div class="kpi"><div class="l">Tracked calls</div><div class="v num">${st.n}</div><div class="s">${L.preds.length} awaiting 4h outcome</div></div><div class="kpi"><div class="l">Direction accuracy</div><div class="v num ${acc!=null&&acc>=.5?'bull':acc!=null&&acc<.5?'bear':''}">${acc==null?'–':(acc*100).toFixed(1)+'%'}</div><div class="s">realized, 4h horizon</div></div><div class="kpi"><div class="l">Calibration</div><div class="v num">${L.cal.toFixed(2)}×</div><div class="s">predicted ${pred==null?'–':(pred*100).toFixed(0)}% vs real ${acc==null?'–':(acc*100).toFixed(0)}%</div></div></div>`;
  const tbl=shown.length?`<table class="mini-tbl" style="margin-top:8px"><thead><tr><th>Coin</th><th>Tracked</th><th>Correct</th><th>Win-chance adj</th></tr></thead><tbody>${shown.map(x=>`<tr><td><b>${esc(x.b)}</b></td><td class="num">${x.n}</td><td class="num ${x.r>=.5?'bull':'bear'}">${(x.r*100).toFixed(0)}%</td><td class="num">${coinAdj(x.b)>=0?'+':''}${(coinAdj(x.b)*100).toFixed(1)}%</td></tr>`).join('')}</tbody></table>`:'';
  return kpis+(tfRows?`<div class="chips">${tfRows}</div>`:'')+tbl+`<p class="small" style="margin:8px 0 0">Every analyzed signal is recorded and graded against the real price 4 hours later. Wrong calls shrink that coin's win chance and ranking; timeframes with a good hit-rate get more weight in the composite score; the three win-chance components (rule backtest · analog · timeframe agreement) re-weight by gradient after every mistake; the global win chance is calibrated so the predicted % tracks the realized hit rate. Closed paper trades feed the same loop, and everything persists in this browser.</p>`}

  const cr=S.crowd.BTC||{};if(cr.longPct!=null&&cr.longPct>.66){sc+=12;rs.push(`${(cr.longPct*100).toFixed(0)}% of BTC accounts long — long-squeeze fuel`)}

  const f=S.fng&&S.fng[0]?+S.fng[0].value:null;if(f!=null){if(f>=78){sc+=12;rs.push(`Extreme Greed (${f}) — euphoric tops often precede flushes`)}else if(f<=15){sc+=6;rs.push(`Extreme Fear (${f}) — panic wicks likely`)}}

function radarSVG(axes,vals,col){const N=axes.length,cx=150,cy=135,R=95;const pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/N;return[cx+Math.cos(a)*R*v,cy+Math.sin(a)*R*v]};
  let g='';for(const lv of[.25,.5,.75,1])g+=`<polygon points="${axes.map((_,i)=>pt(i,lv).join(',')).join(' ')}" fill="none" stroke="#DCE8F0"/>`;
  axes.forEach((_,i)=>{const[x,y]=pt(i,1);g+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#E4EEF4"/>`});
  const poly=vals.map((v,i)=>pt(i,clamp(v,.04,1)).join(',')).join(' ');
  const labels=axes.map((a,i)=>{const[x,y]=pt(i,1.2);return`<text x="${x}" y="${y}" font-size="11" font-weight="700" fill="#557086" text-anchor="${Math.abs(x-cx)<10?'middle':x>cx?'start':'end'}" dominant-baseline="middle">${esc(a)} ${Math.round(vals[i]*100)}</text>`}).join('');
  return`<svg class="radar-svg" viewBox="-62 0 424 270">${g}<polygon points="${poly}" fill="${col}" fill-opacity=".22" stroke="${col}" stroke-width="2.2"/>${vals.map((v,i)=>{const[x,y]=pt(i,clamp(v,.04,1));return`<circle cx="${x}" cy="${y}" r="3.5" fill="${col}"/>`}).join('')}${labels}</svg>`}

/* ---------------- AI analyst ---------------- */
function normCoin(s){s=String(s||'').toUpperCase().trim().replace(/[\s\/_-]*(USDT|USD|PERP)$/,'').replace(/[^A-Z0-9]/g,'');if(S.meta[s])return s;const[b]=parseMult(s);return S.meta[b]?b:s}
function findCoin(q){const words=String(q).toUpperCase().replace(/[^A-Z0-9 ]/g,' ').split(/\s+/).filter(Boolean);
  const stop=new Set(['I','A','AN','THE','TO','IS','IT','ON','OR','IN','OF','FOR','AND','BE','DO','MY','ME','NOW','BUY','SELL','LONG','SHORT','WHAT','HOW','WHY','WHEN','BEST','TOP','TRADE','COIN','COINS','RISK','SHOULD','CAN','WILL','TODAY','HOUR','HOURS','UP','DOWN','PUMP','DUMP','MARKET','AI','GO','SO','AT','ALL','ANY','NEW','ONE','ARE','YOU','THIS','THAT','WITH','HIGH','LOW','OK','NO','YES','ENTRY','EXIT','STOP','LOSS','TAKE','PROFIT','FEAR','GREED','NEWS','CRASH','SAFE','MUCH','MANY','LEVERAGE','FUNDING','RATE','POSITION','SIZE','CHART','PRICE','SIGNAL','GOOD','BAD','HOLD','OUT','NOT','DONT','IF','THEN','BULL','BEAR','PEOPLE','CROWD','NEXT','WEEK','DAY','VS','OVER','UNDER','BETWEEN','30M','1H','2H','4H','8H','TIME','FRAME','TIMEFRAME','MORE','LESS','BIG','GET','WIN','PROBLEM','HELP','EXPLAIN','MEAN','MEANS','WORK','WORKS','APP']);
  for(const w of words){if(stop.has(w))continue;if(S.meta[w]&&isCrypto(w))return w;const n=normCoin(w);if(S.meta[n]&&isCrypto(n))return n}
  const low=String(q).toLowerCase();const names=Object.assign({},S.cgNames||{},NAMES);for(const[s,n]of Object.entries(names)){if(n&&n.length>=4&&new RegExp('\\b'+n.toLowerCase().replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b').test(low)&&S.meta[s])return s}
  return null}
function findTf(q){const m=String(q).toLowerCase().match(/\b(30\s?m(in)?|1\s?h|2\s?h|4\s?h|8\s?h|(\d)\s?hours?|half\s?hour)\b/);if(!m)return null;const t=m[0].replace(/\s|in|ours?|our/g,'');if(/half/.test(m[0]))return'30m';const n=t.match(/^(\d+)/);if(t.startsWith('30'))return'30m';if(n&&['1','2','4','8'].includes(n[1]))return n[1]+'h';return null}
function tfPlan(R,tf){
  const x=R.tf[tf]||R.tf['1h'];const a=R.an&&R.an[tf];const d=x.dir||R.lean;const k=d>0?x.bt.long:x.bt.short;const btw=(k.w+3)/(k.n+6);
  let pAn=.5,powW=.6;if(a){pAn=d>0?a.up:1-a.up;if(a.power!=null)powW=clamp((a.power-.42)/.16,0,1.2)}
  const align=R.tf['4h']&&R.tf['4h'].dir===d?.03:R.tf['4h']&&R.tf['4h'].dir===-d?-.04:0;
  const win=clamp(.5*btw+.5*(.5+(pAn-.5)*.85*powW)+align,.2,.85);
  const e=R.price,at=x.atr;const sl=e-d*1.5*at,tp1=e+d*2*at,tp2=e+d*3.5*at;
  let verdict,cls;
  if(R.trade&&R.dir===x.dir)verdict={t:`${x.dir>0?'LONG':'SHORT'} — aligned with the full multi-timeframe setup`,c:'g'};
  else if(x.dir!==0&&Math.abs(x.s)>=35&&pAn>=.55&&win>=.55)verdict={t:`${x.dir>0?'LONG':'SHORT'} — ${tf}-only setup (smaller size; higher timeframes not fully aligned)`,c:'y'};
  else verdict={t:`NO TRADE on ${tf} — wait (${x.dir===0?'no clear trend':'signal too weak or not confirmed'})`,c:'r'};
  return{x,a,d,win,sl,tp1,tp2,e,verdict,btw,pAn,k}}
function aiReport(R,tf){
  const P=tfPlan(R,tf);const cr=S.crowd[R.b]||{};const crash=crashRisk();const nt=noTradeList();const ns=newsFor(R.b);
  let h=`<div class="advice ${P.verdict.c}" style="margin-top:0"><b>${esc(R.b)} · ${tf} verdict</b>${esc(P.verdict.t)}</div>`;
  h+=`<div class="lv" style="margin-top:10px"><div><span>Entry</span><b class="num">${fp(P.e)}</b></div><div><span>Stop</span><b class="num bear">${fp(P.sl)}</b></div><div><span>TP1</span><b class="num bull">${fp(P.tp1)}</b></div><div><span>TP2</span><b class="num bull">${fp(P.tp2)}</b></div></div>`;
  h+=`<p><b>${tf} win chance ${(P.win*100).toFixed(0)}%</b> (${P.k.n} past ${P.d>0?'long':'short'} signals on ${tf}; analog ${(P.pAn*100).toFixed(0)}% ${P.d>0?'up':'down'}${P.a&&P.a.power!=null?`, model power ${(P.a.power*100).toFixed(0)}% on unseen bars`:''}). Overall multi-timeframe grade ${R.grade}, ${R.passed}/${R.tests.length} tests passed, overall win chance ${(R.win*100).toFixed(0)}%.</p>`;
  h+=`<p><b>Reading the chart (${tf}):</b> trend score ${P.x.s.toFixed(0)}, RSI ${P.x.rsi.toFixed(0)}${P.x.rsi>70?' (overbought — late to chase)':P.x.rsi<30?' (oversold — late to short)':''}, ADX ${P.x.adx.toFixed(0)} (${P.x.adx>=25?'strong trend':P.x.adx>=18?'developing trend':'choppy'}), price ${R.price>P.x.e20?'above':'below'} EMA20 and ${R.price>P.x.e50?'above':'below'} EMA50. 24-bar support ${fp(P.x.sup)}, resistance ${fp(P.x.res)}.</p>`;
  if(P.a)h+=`<p><b>Prediction:</b> similar historical setups suggest a median move of ${fpct(P.a.med*100)} over ${tf}, likely range ${fp(R.price*(1+P.a.p25))} – ${fp(R.price*(1+P.a.p75))}.</p>`;
  h+=tfTable(R);
  if(cr.longPct!=null)h+=`<p><b>People setup:</b> ${(cr.longPct*100).toFixed(0)}% of accounts long${cr.taker!=null?`, taker buy/sell ${cr.taker.toFixed(2)}`:''}${cr.oiChg!=null?`, open interest ${fpct(cr.oiChg,1)} in 24h`:''}. ${cr.longPct>.7?'Crowded long — be careful buying here.':cr.longPct<.4?'Crowded short — squeeze risk if you short.':'Positioning is not extreme.'}</p>`;
  if(R.trap)h+=`<p><b>Market-trap check:</b> ${R.trap.label} risk (${(R.trap.risk*100).toFixed(0)}/100)${R.trap.list.length?' — '+R.trap.list.slice(0,3).map(t=>esc(t.n)+' ('+esc(t.tf)+'): '+esc(t.d)).join('; '):' — no trap against this direction'}.${R.trap.ok?'':' <b>Do not enter until the trap resolves.</b>'}${R.trap.fav.length?' Opposite side trapped: '+esc(R.trap.fav[0].n)+'.':''}</p>`;
  if(ns.n)h+=`<p><b>News &amp; chat:</b> ${ns.n} mentions recently, tone ${ns.s>0?'positive':ns.s<0?'negative':'neutral'}.</p>`;
  if(crash)h+=`<p><b>Crash risk:</b> ${crash.label} (${crash.score}/100)${crash.reasons[0]?' — '+esc(crash.reasons[0]):''}.</p>`;
  if(nt.length)h+=`<p><b>Reasons to hold back:</b> ${nt.map(esc).join(' ')}</p>`;
  h+=`<p><b>What a disciplined trader does:</b> ${P.verdict.c==='r'?`Nothing yet. Set an alert near ${fp(P.d>0?P.x.res:P.x.sup)} (break) or ${fp(P.d>0?P.x.sup:P.x.res)} (retest) and let the scanner confirm.`:`Risk at most 1% of the account: position size = 1% ÷ ${(Math.abs(P.e-P.sl)/P.e*100).toFixed(2)}% stop distance = ${(1/(Math.abs(P.e-P.sl)/P.e*100)*100).toFixed(0)}% of account notional. Take half at TP1, move the stop to entry, trail the rest.`}</p>`;
  return h}

/* ---------------- pure-JS SHA-512 + HMAC-SHA512 (Gate.io request signing) ---------------- */
const _S512=(function(){
  const mask=0xFFFFFFFFFFFFFFFFn;
  function iroot(n,e){if(n<2n)return n;const E=BigInt(e);let lo=1n,hi=1n;while(hi**E<=n)hi*=2n;while(lo<hi){const mid=(lo+hi+1n)>>1n;if(mid**E<=n)lo=mid;else hi=mid-1n}return lo}
  function primes(n){const p=[];for(let x=2n;p.length<n;x++){let ok=true;for(const q of p){if(q*q>x)break;if(x%q===0n){ok=false;break}}if(ok)p.push(x)}return p}
  const P=primes(80);
  const K=P.map(p=>iroot(p<<192n,3)-(iroot(p,3)<<64n));
  const H=P.slice(0,8).map(p=>iroot(p<<128n,2)-(iroot(p,2)<<64n));
  const rotr=(x,n)=>((x>>BigInt(n))|(x<<(64n-BigInt(n))))&mask;
  function bytes(msg){
    const padLen=((msg.length+17+127)>>7)<<7;
    const buf=new Uint8Array(padLen);buf.set(msg);buf[msg.length]=0x80;
    let l=BigInt(msg.length)*8n;for(let i=padLen-1;i>=padLen-16;i--){buf[i]=Number(l&255n);l>>=8n}
    const h=H.map(x=>x);const w=new Array(80).fill(0n);
    for(let off=0;off<padLen;off+=128){
      for(let i=0;i<16;i++){let v=0n;for(let j=0;j<8;j++)v=(v<<8n)|BigInt(buf[off+i*8+j]);w[i]=v}
      for(let i=16;i<80;i++){
        const w15=w[i-15],w2=w[i-2];
        const s0=rotr(w15,1)^rotr(w15,8)^(w15>>7n);
        const s1=rotr(w2,19)^rotr(w2,61)^(w2>>6n);
        w[i]=(w[i-16]+s0+w[i-7]+s1)&mask;
      }
      let a=h[0],b=h[1],c=h[2],d=h[3],e=h[4],f=h[5],g=h[6],hh=h[7];
      for(let i=0;i<80;i++){
        const S1=rotr(e,14)^rotr(e,18)^rotr(e,41);
        const ch=(e&f)^(~e&g);
        const t1=(hh+S1+ch+K[i]+w[i])&mask;
        const S0=rotr(a,28)^rotr(a,34)^rotr(a,39);
        const mj=(a&b)^(a&c)^(b&c);
        const t2=(S0+mj)&mask;
        hh=g;g=f;f=e;e=(d+t1)&mask;d=c;c=b;b=a;a=(t1+t2)&mask;
      }
      h[0]=(h[0]+a)&mask;h[1]=(h[1]+b)&mask;h[2]=(h[2]+c)&mask;h[3]=(h[3]+d)&mask;h[4]=(h[4]+e)&mask;h[5]=(h[5]+f)&mask;h[6]=(h[6]+g)&mask;h[7]=(h[7]+hh)&mask;
    }
    const out=new Uint8Array(64);
    for(let i=0;i<8;i++){let v=h[i];for(let j=7;j>=0;j--){out[i*8+j]=Number(v&255n);v>>=8n}}
    return out;
  }
  return {bytes,hex(u8){return [...u8].map(x=>x.toString(16).padStart(2,'0')).join('')}};
})();
function sha512hex(str){return _S512.hex(_S512.bytes(new TextEncoder().encode(str)))}
function hmac512hex(keyStr,msgStr){
  const enc=new TextEncoder();
  let key=enc.encode(keyStr);
  if(key.length>128)key=_S512.bytes(key);
  const kp=new Uint8Array(128);kp.set(key);
  const o=new Uint8Array(128),ip=new Uint8Array(128);
  for(let j=0;j<128;j++){o[j]=kp[j]^92;ip[j]=kp[j]^54}
  const cat=(a,b)=>{const r=new Uint8Array(a.length+b.length);r.set(a);r.set(b,a.length);return r};
  return _S512.hex(_S512.bytes(cat(o,_S512.bytes(cat(ip,enc.encode(msgStr))))));
}

/* ---------------- Gate.io private API ---------------- */
async function gateApi(method,path,opt={}){
  if(!BT.api.key||!BT.api.secret)throw new Error('Gate.io API keys missing — enter them in API settings');
  // Call sites pass request payloads directly; GET query options use {query:"..."}.
  const qs=opt&&typeof opt.query==='string'?opt.query:'';
  const payload=opt&&Object.prototype.hasOwnProperty.call(opt,'body')?opt.body:(qs?'':opt);
  const bodyStr=payload&&Object.keys(payload).length?JSON.stringify(payload):'';
  const ts=String(Math.floor(Date.now()/1000));
  const payloadHash=sha512hex(bodyStr);
  const sign=hmac512hex(BT.api.secret,method.toUpperCase()+'\n'+path+'\n'+qs+'\n'+payloadHash+'\n'+ts);
  const url=(gateProxy()||'https://api.gateio.ws')+path+(qs?'?'+qs:'');
  const r=await fetch(url,{method,headers:{KEY:BT.api.key,SIGN:sign,TIMESTAMP:ts,'Content-Type':'application/json',Accept:'application/json'},body:bodyStr||undefined});
  let j=null;try{j=await r.json()}catch(e){}
  if(!r.ok){const e=new Error((j&&(j.message||j.label))||('HTTP '+r.status));e.status=r.status;throw e}
  return j;
}

function bestTf(R){

function botCloseRecord(t,px,st,reason){
  t.exit=px;t.st=st;t.t1=Date.now();t.reason=reason;
  t.pnlPct=(px-t.entry)/t.entry*t.dir*100;
  t.pnlUsd=t.pnlPct/100*t.notional;
  if(t.mode==='demo'&&t.margin>0&&t.pnlUsd<-t.margin){t.pnlUsd=-t.margin;t.pnlPct=t.pnlUsd/t.notional*100;t.reason=(reason?reason+' · ':'')+'liquidated (margin lost)'}
  if(t.mode==='demo')BT.fundUsd=Math.max(0,(+BT.fundUsd||0)+t.pnlUsd);
  else BT.bal=Math.max(0,(BT.bal||0)+t.pnlUsd);
  BT.open=BT.open.filter(x=>x.id!==t.id);
  botTrades.push(t);if(botTrades.length>400)botTrades.shift();
  botLearnUpdate(t,st);
  botSave();
  toast(t.b+' '+(st==='win'?'TP hit':st==='loss'?'SL hit':'closed')+' · '+(t.pnlPct>=0?'+':'')+t.pnlPct.toFixed(2)+'% ('+(t.pnlUsd>=0?'+':'')+t.pnlUsd.toFixed(2)+' USDT)');
  notifyTrade('close',t);
  if(S.page==='p5')renderPaper();
}
function botEvalDemo(t,zone){
  const p=livePrice(t.b);if(!p)return;t.last=p;
  t.hiS=Math.max(t.hiS||t.entry||p,p);t.loS=Math.min(t.loS||t.entry||p,p); // running extremes seen live since entry
  let hi=t.hiS,lo=t.loS;
  const k=KC[t.b+'|30m'];if(k)for(const c of k.c){if(c.t>=t.t0){hi=Math.max(hi,c.h);lo=Math.min(lo,c.l)}} // every candle that opened after entry (never before it)
  if(t.dir>0){
    if(lo<=t.sl)return botCloseRecord(t,t.sl,'loss','stop-loss hit');
    if(hi>=t.tp1)return botCloseRecord(t,t.tp1,'win','take-profit hit');
  }else{
    if(hi>=t.sl)return botCloseRecord(t,t.sl,'loss','stop-loss hit');
    if(lo<=t.tp1)return botCloseRecord(t,t.tp1,'win','take-profit hit');
  }
  if(Date.now()-t.t0>24*36e5)return botCloseRecord(t,p,'exp','24h timeout — AI closed at market');
  const hd=zoneHoldDecision(zone);
  if(!hd.hold)return botCloseRecord(t,p,'exp','AI terminated: '+hd.why);
}
async function botPollLive(t){
  if(!t.sym){const M=(S.meta[t.b]||{}).gate;if(M)t.sym=M.sym}
  if(!t.sym)return;
  try{
    const pos=await gateApi('GET','/api/v4/futures/usdt/positions/'+t.sym);
    const size=+pos.size||0;
    const mp=livePrice(t.b)||+pos.mark_price;if(mp)t.last=mp;
    if(size===0){
      let exit=mp||t.last||t.entry;
      try{
        const os=await gateApi('GET','/api/v4/futures/usdt/orders',{query:'contract='+t.sym+'&status=finished&limit=20'});
        const red=os.filter(o=>Math.sign(+o.size)===-Math.sign(t.dir>0?1:-1)&&o.finish_time&&o.finish_time*1000>=t.t0-60000);
        if(red.length){const o=red.sort((a,b)=>b.finish_time-a.finish_time)[0];exit=+(o.fill_price||o.avg_fill_price||o.price)||exit}
      }catch(e){}
      const tol=Math.abs(t.entry-t.sl)*.02;
      const st=(t.dir>0?exit>=t.tp1-tol:exit<=t.tp1+tol)?'win':(t.dir>0?exit<=t.sl+tol:exit>=t.sl-tol)?'loss':'exp';
      // Remove the sibling protection order after either exit path has closed the position.
      if(t.stopId){try{await gateApi('DELETE','/api/v4/futures/usdt/price_orders/'+t.stopId)}catch(e){}}
      if(t.tpOrderId){try{await gateApi('DELETE','/api/v4/futures/usdt/orders/'+t.tpOrderId)}catch(e){}}
      botCloseRecord(t,exit,st,'closed on Gate.io');
    }else t.contracts=Math.abs(size);
  }catch(e){logErr('gate poll '+t.b,e)}
}
async function botCloseLive(t){
  if(t.stopId){try{await gateApi('DELETE','/api/v4/futures/usdt/price_orders/'+t.stopId)}catch(e){}}
  if(t.tpOrderId){try{await gateApi('DELETE','/api/v4/futures/usdt/orders/'+t.tpOrderId)}catch(e){}}
  try{
    const os=await gateApi('GET','/api/v4/futures/usdt/orders',{query:'contract='+t.sym+'&status=open'});
    for(const o of os){if(o.text==='t-SPBOT'){try{await gateApi('DELETE','/api/v4/futures/usdt/orders/'+o.id)}catch(e){}}}
  }catch(e){}
  let size=0;
  try{const pos=await gateApi('GET','/api/v4/futures/usdt/positions/'+t.sym);size=+pos.size||0}catch(e){}
  let exitFill=null;
  if(size!==0){
    const co=await gateApi('POST','/api/v4/futures/usdt/orders',{contract:t.sym,size:-size,price:'0',tif:'ioc',reduce_only:true,text:'t-SPBOT'});
    try{const od=await gateApi('GET','/api/v4/futures/usdt/orders/'+co.id);const f=+(od.fill_price||0);if(f>0)exitFill=f}catch(e){}
    let pos2=await gateApi('GET','/api/v4/futures/usdt/positions/'+t.sym);
    if(+pos2.size){try{await gateApi('POST','/api/v4/futures/usdt/orders',{contract:t.sym,size:-+pos2.size,price:'0',tif:'ioc',text:'t-SPBOT'})}catch(e){}}
  }
  const p=exitFill||livePrice(t.b)||t.last||t.entry;
  botCloseRecord(t,p,(p-t.entry)*t.dir>0?'win':'loss','manual close');
}
async function botEnterLive(t,entry0){
  const M=S.meta[t.b].gate;if(!M||!M.sym)throw new Error(t.b+' is not listed on Gate.io futures');
  // Refuse to net with, increase, or accidentally close a manually-held position.
  const existing=await gateApi('GET','/api/v4/futures/usdt/positions/'+M.sym);
  if(+existing.size)throw new Error('Existing Gate.io position on '+M.sym+'; close or manage it manually before enabling this bot coin');
  const qm=M.qm||1;
  const contracts=Math.floor(t.notional/(entry0*qm));
  if(contracts<1)throw new Error('Calculated size is below one Gate.io contract; increase allocated funds or reduce risk settings');
  t.sym=M.sym;t.contracts=contracts;
  await gateSetLev(M.sym,t.lev);
  const o=await gateApi('POST','/api/v4/futures/usdt/orders',{contract:M.sym,size:t.dir>0?contracts:-contracts,price:'0',tif:'ioc',text:'t-SPBOT'});
  let fill=entry0;
  try{
    const od=await gateApi('GET','/api/v4/futures/usdt/orders/'+o.id);
    const f=+(od.fill_price||0);if(f>0)fill=f;
    if(od.status==='open'){try{await gateApi('DELETE','/api/v4/futures/usdt/orders/'+o.id)}catch(e){}throw new Error('market entry did not fill')}
  }catch(e){
    // A market IOC can partially fill before the order lookup fails. Never leave
    // an untracked position behind: cancel the entry and flatten any residual.
    try{await gateApi('DELETE','/api/v4/futures/usdt/orders/'+o.id)}catch(cleanErr){}
    try{const pos=await gateApi('GET','/api/v4/futures/usdt/positions/'+M.sym);const liveSize=+pos.size||0;
      if(liveSize)await gateApi('POST','/api/v4/futures/usdt/orders',{contract:M.sym,size:-liveSize,price:'0',tif:'ioc',text:'t-SPBOT'});
    }catch(flatErr){logErr('CRITICAL: entry cleanup failed '+M.sym,flatErr)}
    throw new Error('Entry fill could not be verified; residual position was flattened where possible. '+(e.message||e));
  }
  t.entry=fill;t.last=fill;
  t.notional=contracts*fill*qm;t.margin=t.notional/t.lev;
  t.sl=fill-t.dir*t.slR*t.atr;t.tp1=fill+t.dir*t.tp1R*t.atr;t.tp2=fill+t.dir*t.tp2R*t.atr;
  t.slPct=Math.abs(fill-t.sl)/fill*100;
  const px1=await gatePriceFmt(M.sym,t.tp1),px2=await gatePriceFmt(M.sym,t.sl);
  try{
    const tp=await gateApi('POST','/api/v4/futures/usdt/orders',{contract:M.sym,size:t.dir>0?-contracts:contracts,price:px1,tif:'gtc',reduce_only:true,text:'t-SPBOT'});
    if(!tp||!tp.id)throw new Error('Gate.io did not confirm the take-profit order');
    t.tpOrderId=tp.id;
    const so=await gateApi('POST','/api/v4/futures/usdt/price_orders',{initial:{contract:M.sym,size:0,price:'0',tif:'ioc',close:true},trigger:{strategy_type:0,price:px2,rule:t.dir>0?2:1}});
    if(!so||!so.id)throw new Error('Gate.io did not confirm the stop-loss order');
    t.stopId=so.id;
  }catch(e){
    // Fail closed: remove any partial TP and flatten the just-opened position.
    if(t.tpOrderId){try{await gateApi('DELETE','/api/v4/futures/usdt/orders/'+t.tpOrderId)}catch(cleanErr){logErr('gate cleanup TP',cleanErr)}}
    if(t.stopId){try{await gateApi('DELETE','/api/v4/futures/usdt/price_orders/'+t.stopId)}catch(cleanErr){logErr('gate cleanup SL',cleanErr)}}
    try{
      const pos=await gateApi('GET','/api/v4/futures/usdt/positions/'+M.sym);
      const liveSize=+pos.size||0;
      if(liveSize)await gateApi('POST','/api/v4/futures/usdt/orders',{contract:M.sym,size:-liveSize,price:'0',tif:'ioc',text:'t-SPBOT'});
    }catch(flatErr){logErr('CRITICAL: emergency flatten failed '+M.sym,flatErr)}
    throw new Error('Protective TP/SL could not both be confirmed. Entry was flattened where possible. '+(e.message||e));
  }
}
async function botEnter(R,zone){
  let tf=BT.tf;
  if(tf==='auto')tf=(BL.adopted&&BL.champion&&BL.champion.tf)||bestTf(R);
  if(!R.tf[tf])tf='1h';
  if(!R.tf[tf]){BOT.state='error';BOT.msg='No timeframe data for '+R.b;return}
  const x=R.tf[tf];const atr=x.atr||((R.tf['1h']||{}).atr)||0;if(!atr){BOT.state='error';BOT.msg='No ATR data for '+R.b;return}
  const dir=R.dir;const auto=BT.tpMode==='auto';
  const slR=auto?(BL.adopted&&BL.champion?BL.champion.slR:BL.slR):BT.slR;
  const tp1R=auto?(BL.adopted&&BL.champion?BL.champion.tp1R:BL.tp1R):BT.tp1R;
  const tp2R=auto?BL.tp2R:BT.tp2R;
  const entry0=livePrice(R.b)||R.price;
  const slPct0=slR*atr/entry0*100;
  const lev=BT.levMode==='auto'?clamp(Math.round(10/Math.max(.3,slPct0)),1,20):BT.lev;
  const baseFund=BT.mode==='demo'?(+BT.fundUsd||0):(BT.bal||0)*BT.fundPct/100;
  const reserved=BT.open.filter(z=>z.mode===BT.mode).reduce((sum,z)=>sum+(+z.margin||0),0);
  const fund=Math.max(0,baseFund-reserved);
  if(fund<10){BOT.state='error';BOT.msg='Available allocation is reserved by open trades or is too small';return}
  const riskAmt=fund*BT.riskPct/100;
  let notional=riskAmt*100/Math.max(.3,slPct0);notional=Math.min(notional,fund*lev*.95);
  if(notional<5){BOT.state='error';BOT.msg='Position too small for this risk setting';return}
  const t={id:'t'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),b:R.b,dir,tf,lev,mode:BT.mode,notional,margin:notional/lev,slPct:slPct0,zone:zone.score,t0:Date.now(),win:R.win,grade:R.grade,slR,tp1R,tp2R,atr,last:entry0};
  if(BT.mode==='live'){
    try{await botEnterLive(t,entry0)}
    catch(e){logErr('bot live entry',e);BOT.skip=BOT.skip||{};BOT.skip[R.b]=Date.now()+30*6e4;BOT.state='error';BOT.msg='Live entry failed on '+R.b+': '+(e.message||e)+' — trying other coins';return}
  }else{
    t.entry=entry0;t.hiS=entry0;t.loS=entry0;
    t.sl=entry0-dir*slR*atr;t.tp1=entry0+dir*tp1R*atr;t.tp2=entry0+dir*tp2R*atr;
  }
  BT.open.push(t);botSave();
  notifyTrade('open',t);
  BOT.state='in_trade';BOT.msg='Entered '+R.b+' '+(dir>0?'LONG':'SHORT')+' on '+tf+' ('+BT.mode+') — AI manages TP, stop and zone';
  if(S.page==='p5')renderPaper();
}

function botCoinOk(b){if(BOT.skip&&BOT.skip[b]>Date.now())return false;if(BT.mode==='live'){const M=S.meta[b];if(!(M&&M.gate&&M.gate.sym))return false}return true}
async function botScan(zone){
  if(BOT.busy)return;BOT.busy=true;BOT.state='analyzing';BOT.msg='Deep-analyzing Majors, Top 100 and Pump/Dump candidates…';if(S.page==='p5')renderPaper();
  try{
    // Keep all three signal universes in the same decision pool. Refresh only
    // stale/missing pages; runScans serializes the work and keeps one scan lock.
    const stale=['p1','p2','p3'].some(p=>!S.pages[p]||Date.now()-S.pages[p].ts>S.settings.scanMin*6e4);
    if(stale&&!S.scanning)await runScans(false);
    let pool=['p1','p2','p3'].flatMap(p=>(S.pages[p]&&S.pages[p].rs)||[])
      .filter(R=>R.dir!==0&&R.trade===true&&['A','B'].includes(R.grade)&&R.trap&&R.trap.ok&&isCrypto(R.b)&&!BT.open.some(t=>t.b===R.b)&&botCoinOk(R.b));
    if(pool.length<3){
      // Fallback candidates also span all page universes, not just Majors.
      const all=[...new Set([...universeP1(),...universeP2(),...universeP3()])];
      const fb=all.map(b=>({b,qv:(tickAgg(b)||{}).qvMax||0})).sort((a,b)=>b.qv-a.qv).slice(0,15);
      for(const x of fb){
        if(BT.open.some(t=>t.b===x.b)||pool.some(R=>R.b===x.b)||!botCoinOk(x.b))continue;
        try{
          const R=await ensureAnalysis(x.b,false);
          if(R.dir!==0&&R.trade===true&&['A','B'].includes(R.grade)&&R.trap&&R.trap.ok&&isCrypto(R.b)&&botCoinOk(R.b))pool.push(R);
        }catch(e){logErr('bot cand '+x.b,e)}
      }
    }
    const seen=new Set();pool=pool.filter(R=>!seen.has(R.b)&&seen.add(R.b));
    for(const R of pool)R._bs=botScore(R);
    pool.sort((a,b)=>b._bs-a._bs);
    BOT.cands=pool.slice(0,5).map(R=>({b:R.b,dir:R.dir,win:R.win,grade:R.grade,score:R._bs,tf:BT.tf==='auto'?((BL.adopted&&BL.champion&&BL.champion.tf)||bestTf(R)):BT.tf,page:R.page||'combined'}));
    const zd=zoneDecision(zone);
    const best=pool.find(R=>R.win*100>=BT.minWin);
    if(BT.open.length>=BT.maxConc){BOT.state='in_trade';BOT.msg='Trading '+BT.open.map(t=>t.b).join(', ')+' — next coin right after exit'}
    else if(!zd.ok){BOT.state='paused_zone';BOT.msg=zd.why}
    else if(!best){BOT.state='waiting';BOT.msg='No A/B candidate across Majors, Top 100 and Pump/Dump above '+BT.minWin+'% — waiting'}
    else await botEnter(best,zone);
  }catch(e){logErr('botScan',e);BOT.state='error';BOT.msg='Scan error: '+(e.message||e)}
  finally{BOT.lastScan=Date.now();BOT.busy=false;if(S.page==='p5'&&!(document.activeElement&&document.activeElement.closest&&document.activeElement.closest('#page-p5')))renderPaper()}
}
async function botTick(){
  // Position management must never be blocked by the slower candidate scan.
  if(BOT.tickBusy)return;
  BOT.tickBusy=true;
  try{
    const zone=botZone();
    for(const t of[...BT.open]){
      if(t.mode==='live')await botPollLive(t);
      else botEvalDemo(t,zone);
    }
    if(!BT.on){
      BOT.state=BT.open.length?'managing':'off';
      if(!BT.open.length&&BOT.state!=='off')BOT.msg='Stopped';
      if(S.page==='p5')tradeLiveUpdate();
      return;
    }
    if(BT.mode==='live'&&BT.apiValid&&Date.now()-(BT._balT||0)>6e4){
      BT._balT=Date.now();
      gateApi('GET','/api/v4/futures/usdt/accounts').then(a=>{BT.bal=+a.available||+a.total||0;botSave();if(S.page==='p5')tradeLiveUpdate()}).catch(e=>{if(e&&(e.status===401||e.status===403))BT.apiValid=false});
    }
    if(!BOT.busy&&BT.open.length<BT.maxConc&&Date.now()-BOT.lastScan>45e3){
      // Do not await the scan: subsequent ticks must continue checking stops/targets.
      botScan(zone).catch(e=>logErr('botScan background',e));
    }else if(BT.open.length>=BT.maxConc){BOT.state='in_trade';BOT.msg='Trading '+BT.open.map(t=>t.b).join(', ')+' — next coin right after exit'}
    if(S.page==='p5')tradeLiveUpdate();
  }catch(e){logErr('botTick',e)}
  finally{BOT.tickBusy=false}
}

function tradeLiveUpdate(){
  document.querySelectorAll('#page-p5 [data-btid]').forEach(card=>{
    const t=BT.open.find(x=>x.id===card.dataset.btid);if(!t)return;
    const p=livePrice(t.b)||t.last;if(!p)return;
    t.last=p;
    const pnl=(p-t.entry)/t.entry*t.dir*100;
    const set=(sel,txt,cls)=>{const e=card.querySelector(sel);if(e){if(e.textContent!==txt)e.textContent=txt;if(cls&&e.className!==cls)e.className=cls}};
    set('[data-bp]',fp(p));
    set('[data-bpnl]',fpct(pnl),'num '+(pnl>=0?'bull':'bear'));
    set('[data-bpusd]',(pnl>=0?'+':'')+(pnl/100*t.notional).toFixed(2)+' USDT','num small '+(pnl>=0?'bull':'bear'));
    const prog=card.querySelector('.meter i');
    if(prog){const pr=clamp(Math.abs(p-t.entry)/Math.max(1e-12,Math.abs(t.entry-t.sl))*100,0,100);prog.style.left=pr.toFixed(0)+'%'}
  });
  const f=$('#botFundKpi');
  if(f)f.textContent=BT.mode==='demo'?'$'+(+BT.fundUsd||0).toFixed(2):fusd(BT.bal||0);
}

document.addEventListener('click',async ev=>{

  switch(act){

      }else{
        BT.on=false;BOT.state=BT.open.length?'managing':'off';BOT.msg='Stopped — open trades keep being managed';botSave();
        toast('Trading bot OFF — no new trades, open trades still managed');
      }

      if(r)BT.api.key=r.value.trim();if(s)BT.api.secret=s.value.trim();
      if(!BT.api.key||!BT.api.secret){toast('Enter API key and secret');break}
      el.textContent='Testing…';
      try{

        BT.apiValid=true;BT.bal=+a.available||+a.total||0;botSave();
        toast('Gate.io API connected · available '+fusd(BT.bal),3500);
      }catch(e){BT.apiValid=false;botSave();toast('API failed: '+(e.message||e),4500)}
      renderPaper();break}
    case'bot-close':{
      const t=BT.open.find(x=>x.id===el.dataset.id);if(!t)break;
      if(t.mode==='live'){
        el.textContent='Closing…';

      }

    case'bot-seg':{BT[el.dataset.k]=el.dataset.v;botSave();renderPaper();break}
    case'bot-conc':{BT.maxConc=+el.dataset.v;botSave();renderPaper();break}
    case'bot-notify-test':{const t={id:'test',test:true,b:'BTC',dir:1,mode:'demo',tf:'1h',entry:100,sl:98,tp1:104,lev:5,slPct:2,win:.6,t0:Date.now()};
      notifyTrade('open',t);setTimeout(()=>{notifyTrade('close',Object.assign({},t,{st:'win',exit:104,pnlPct:4,pnlUsd:2,notional:50,reason:'test'}));S.alerts=S.alerts.filter(a=>a.key!=='trade-test');lsSet('csp_alerts',S.alerts)},2500);break}
    case'bot-cal':{botCalibrate();toast('Calibrated from backtest history');break}
    case'bot-export':{
      const rs=[['coin','side','mode','tf','entry','stop','tp1','exit','pnl_pct','pnl_usdt','result','reason','opened','closed']];

      const csv=rs.map(r=>r.map(csvCell).join(',')).join('\n');
      const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='signalpro-bot-trades.csv';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);

  if(p==='p1'||p==='p2'||p==='p3')renderSignalPage(p);
  else if(p==='p4'){const ae=document.activeElement;if(ae&&ae.closest&&ae.closest('#page-p4')&&/INPUT|SELECT|TEXTAREA/.test(ae.tagName)){S.p4dirty=true}else{renderRadar();S.p4dirty=false}}
  else{const ae=document.activeElement;if(ae&&ae.closest&&ae.closest('#page-p5')&&/INPUT|SELECT|TEXTAREA/.test(ae.tagName)){S.p5dirty=true}else{renderPaper();S.p5dirty=false}}
  renderStatus()}
function renderLive(){
  document.querySelectorAll('[data-px]').forEach(el=>{const p=livePrice(el.getAttribute('data-px'));if(p){const t=fp(p);if(el.textContent!==t){el.textContent=t;el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash')}}});
  if(S.page==='p5')tradeLiveUpdate();renderStatus()}
function renderEx(){for(const id of['binance','bybit','gate']){const el=$('#ex-'+id);if(!el)continue;const e=EX[id];el.className='ex '+(e.up===true?'up':e.up===false?'down':'wait');el.title=e.up?`${e.name} connected${e.lat?' · '+e.lat+'ms':''}`:e.up===false?`${e.name} unreachable: ${e.err}`:'checking'}}
function renderStatus(){const el=$('#statusTxt');if(!el)return;const up=['binance','bybit','gate'].filter(x=>EX[x].up).length;
  let t;if(S.scanning&&progress.total)t=`Scanning ${({p1:'majors',p2:'top 100',p3:'movers'})[progress.label]||''} ${progress.done}/${progress.total}`;
  else if(!S.lastTick)t='Connecting…';else{const nx=Math.min(...['p1','p2','p3'].map(p=>S.pages[p]?S.pages[p].ts+S.settings.scanMin*6e4:Date.now()));const m=Math.max(0,Math.round((nx-Date.now())/6e4));t=`${up}/3 live · prices ${ago(S.lastTick)} · rescan ${m?'in '+m+'m':'now'}`}
  el.textContent=t}
function go(p){S.page=p;document.querySelectorAll('.page').forEach(x=>x.classList.toggle('active',x.dataset.page===p));document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.go===p));
  render();window.scrollTo(0,0);if(['p1','p2','p3'].includes(p)&&!S.pages[p]&&!S.scanning&&S.lastTick)runScans(false,p)}

/* ---------------- events ---------------- */
document.addEventListener('click',async ev=>{
  unlockAudio();
  const g=ev.target.closest('[data-go]');if(g){go(g.dataset.go);return}
  const el=ev.target.closest('[data-act]');if(!el)return;const act=el.dataset.act,b=el.dataset.b;
  switch(act){
    case'detail':if(b)openDetail(b);break;
    case'reanalyze':if(b)openDetail(b,true);break;
    case'ask':closeSheet();S.aiCoin=b;go('p4');setTimeout(()=>{const i=$('#aiCoin');if(i){i.value=b;$('#aiCard').scrollIntoView({behavior:'smooth',block:'start'});aiRun()}},60);break;
    case'ai-run':aiRun();break;
    case'ask-send':askSend();break;
    case'ask-q':askSend(el.dataset.q);break;
    case'tgl':{const k=el.dataset.k;S.settings[k]=!S.settings[k];
      if(k==='notify'&&S.settings.notify){const ok=await askNotify();if(!ok)S.settings.notify=false}
      if(k==='keepAwake')applyWake();saveSettings();el.classList.toggle('on',!!S.settings[k]);break}
    case'gproxy-save':{const v=(($('#gateProxyUrl')||{}).value||'').trim().replace(/\/+$/,'');if(v&&!/^https:\/\/[^\s\/]+(\/\S*)?$/.test(v)){toast('Enter a full https:// URL or leave empty');break}S.settings.gateProxy=v;saveSettings();EX.gate.downUntil=0;EX.gate.fails=0;toast(v?'Gate.io proxy saved':'Gate.io proxy off');render();break}
    case'ntfy-gen':{const t='signalpro-'+Array.from(crypto.getRandomValues(new Uint8Array(12)),x=>'abcdefghijkmnpqrstuvwxyz23456789'[x%32]).join('');const i=$('#ntfyTopic');if(i)i.value=t;toast('Topic created — tap Save, then subscribe to it in ntfy',3500);break}
    case'ntfy-save':{const v=(($('#ntfyTopic')||{}).value||'').trim();if(v&&!/^[A-Za-z0-9_-]{6,64}$/.test(v)){toast('Use 6–64 letters, numbers, - or _');break}S.settings.ntfy=v;saveSettings();toast(v?'Cloud alert topic saved':'Cloud alerts off');render();break}
    case'ntfy-test':{const v=S.settings.ntfy||(($('#ntfyTopic')||{}).value||'').trim();if(!v){toast('Enter or make a topic first');break}
      fetch('https://ntfy.sh/',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({topic:v,title:'SignalPro test push',message:'Cloud alerts are connected. Real signals arrive here when the app is closed.',tags:['white_check_mark'],priority:4})}).then(r=>toast(r.ok?'Test push sent — check the ntfy app':'Push failed ('+r.status+')',3500)).catch(e=>toast('Push failed: '+e.message,3500));break}
    case'test-alarm':{const R=(S.pages.p1&&S.pages.p1.main)||Object.values(S.res)[0];if(!R){toast('No analysis yet — wait for the first scan');break}fireAlert(R,{key:'test-'+Date.now()});break}
    case'diag':openSheet('Diagnostics',diagHtml());break;
    case'alarm-close':$('#alarm').classList.remove('show');break;
    case'alarm-trade':$('#alarm').classList.remove('show');go('p5');break;
    case'alarm-open':$('#alarm').classList.remove('show');if(b)openDetail(b);break;
    case'paper-export':exportPaper();break;
    case'paper-clear':if(el.dataset.armed){S.paper=[];savePaper();toast('Paper history cleared');renderPaper()}else{el.dataset.armed='1';el.textContent='Tap again to confirm';setTimeout(()=>{if(el.isConnected){delete el.dataset.armed;el.textContent='Clear history'}},4000)}break;
  }});
document.addEventListener('change',ev=>{const el=ev.target;if(!el.dataset)return;
  if(el.dataset.act==='set'){S.settings[el.dataset.k]=+el.value;saveSettings();toast('Saved');renderStatus()}
  else if(el.dataset.act==='src'){S.settings.src=el.value.split(',');saveSettings();for(const k in KC)delete KC[k];toast('Candle source order saved — refreshing');runScans(true)}
  else if(el.id==='aiTf'){S.aiTf=el.value}});
document.addEventListener('keydown',ev=>{if(ev.key!=='Enter')return;if(ev.target.id==='askInp'){ev.preventDefault();askSend()}else if(ev.target.id==='aiCoin'){ev.preventDefault();ev.target.blur();aiRun()}});
document.addEventListener('focusout',()=>{setTimeout(()=>{if(S.p4dirty&&S.page==='p4'){const ae=document.activeElement;if(!(ae&&ae.closest&&ae.closest('#page-p4')&&/INPUT|SELECT/.test(ae.tagName))){const ci=$('#aiCoin');if(ci)S.aiCoin=ci.value;renderRadar();S.p4dirty=false}}},300)});
$('#sheetClose').addEventListener('click',closeSheet);$('#sheetBg').addEventListener('click',closeSheet);
$('#alarm').addEventListener('click',e=>{if(e.target.id==='alarm')$('#alarm').classList.remove('show')});
$('#refreshBtn').addEventListener('click',()=>refreshNow());
$('#bellBtn').addEventListener('click',async()=>{unlockAudio();S.settings.sound=true;const ok=await askNotify();S.settings.notify=ok;saveSettings();
  $('#bellDot').classList.toggle('off',!ok&&!S.settings.sound);toast(ok?'Alerts on: sound + system notification':'Alerts on: in-app alarm + sound'+(isIOS()&&!isStandalone()?' · Add to Home Screen for iPhone notifications':''),3800);if(S.page==='p4')render()});

async function refreshNow(){
  if(refreshBusy)return;
  refreshBusy=true;unlockAudio();for(const id in EX){EX[id].downUntil=0}
  const btn=$('#refreshBtn');btn.classList.add('spin');toast(S.scanning?'Refreshing prices — deep scan already running':'Refreshing live data…');
  try{
    try{await withTimeout(tickAll(),20e3,'tick')}catch(e){logErr('refresh tick',e)}
    if(!Object.keys(S.meta).length)await bootMeta().catch(e=>logErr('meta',e));
    if(S.page==='p4'){Promise.all([loadNews(true),loadFng(),loadTrending(),loadReddit()]).then(render).catch(()=>{})}
    if(S.scanning){S.pendingForce=['p1','p2','p3'].includes(S.page)?S.page:'p1';render();return}
    await runScans(true,['p1','p2','p3'].includes(S.page)?S.page:'p1');
    await runScans(false);
  }catch(e){logErr('refresh',e)}
  finally{refreshBusy=false;if(!S.scanning)btn.classList.remove('spin')}
}

function isIOS(){return/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1)}
function isStandalone(){return window.navigator.standalone===true||matchMedia('(display-mode: standalone)').matches}
async function askNotify(){if(!('Notification'in window))return false;try{if(Notification.permission==='granted')return true;if(Notification.permission==='denied')return false;const r=await Notification.requestPermission();return r==='granted'}catch(e){return false}}
let wakeLock=null;
async function applyWake(){try{if(S.settings.keepAwake&&'wakeLock'in navigator&&!document.hidden){if(!wakeLock){wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>{wakeLock=null})}}else if(wakeLock){await wakeLock.release();wakeLock=null}}catch(e){logErr('wake',e)}}
function exportPaper(){const rows=[['coin','side','page','status','entry','stop','tp1','exit','pnl_pct','model_win','grade','opened','closed']];
  for(const x of S.paper)rows.push([x.b,x.dir>0?'LONG':'SHORT',x.page,x.st,x.entry,x.sl,x.tp1,x.exit!=null?x.exit:'',x.pnl!=null?x.pnl.toFixed(3):'',(x.win*100).toFixed(1),x.grade,new Date(x.t0).toISOString(),x.t1?new Date(x.t1).toISOString():'']);
  const csv=rows.map(r=>r.map(csvCell).join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='signalpro-paper-trades.csv';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}
function diagHtml(){return`<div class="card"><table class="mini-tbl"><tbody>${['binance','bybit','gate'].map(x=>`<tr><td><b>${EX[x].name}</b></td><td>${EX[x].up?'connected':EX[x].up===false?'down':'checking'}</td><td class="num">${EX[x].lat||'–'}ms</td><td class="small">${esc(EX[x].err)}</td></tr>`).join('')}
  <tr><td>Contracts</td><td colspan="3" class="num">${Object.keys(S.meta).length} symbols · ${Object.keys(S.meta).filter(isCrypto).length} crypto</td></tr><tr><td>Candle sets</td><td colspan="3" class="num">${Object.keys(KC).length} cached</td></tr><tr><td>Analyzed</td><td colspan="3" class="num">${Object.keys(S.res).length} coins</td></tr><tr><td>News</td><td colspan="3" class="num">${(S.news||[]).length} headlines · ${(S.reddit||[]).length} posts</td></tr><tr><td>Notifications</td><td colspan="3">${'Notification'in window?Notification.permission:'not supported here'}${isIOS()&&!isStandalone()?' · add to Home Screen':''}</td></tr></tbody></table></div>
  <h2 class="sec">Recent errors</h2><div class="card">${S.errors.length?[...S.errors].reverse().slice(0,30).map(e=>`<div class="small num">${hhmm(e.t)} · ${esc(e.where)} · ${esc(e.m)}</div>`).join(''):'<p class="small" style="margin:0">No errors.</p>'}</div>`}

/* ---------------- loops ---------------- */
let tickBusy=false,refreshBusy=false;
async function tickLoop(){if(!tickBusy&&Object.keys(S.meta).length){tickBusy=true;try{await withTimeout(tickAll(),25e3,'tick')}catch(e){logErr('tick',e)}finally{tickBusy=false}}setTimeout(tickLoop,(document.hidden?45:(S.settings.tickSec||20))*1000)}
function scanLoop(){try{if(!S.scanning&&S.lastTick)runScans(false);learnEvaluate().catch(e=>logErr('learn',e))}catch(e){logErr('scanLoop',e)}setTimeout(scanLoop,document.hidden?60e3:30e3)}
async function sentimentLoop(){try{await Promise.allSettled([loadFng(),loadNews(),loadReddit(),loadTrending(),loadGlobal()]);if(S.page==='p4')render()}catch(e){}setTimeout(sentimentLoop,10*6e4)}
let resumeBusy=false;
async function resumeApp(reason){
  if(document.hidden||resumeBusy)return;
  resumeBusy=true;
  try{
    applyWake();
    if(!navigator.onLine){$('#statusTxt').textContent='Offline — waiting for network';return}
    if(!Object.keys(S.meta).length)await bootMeta();
    if(Object.keys(S.meta).length){
      await tickAll().catch(e=>logErr('resume tick '+reason,e));
      learnEvaluate().catch(e=>logErr('resume learning',e));
      if(!S.scanning)runScans(false).catch(e=>logErr('resume scan '+reason,e));
      if(BT.on||BT.open.length)botTick().catch(e=>logErr('resume bot',e));
    }
  }catch(e){logErr('resume '+reason,e)}
  finally{resumeBusy=false}
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)resumeApp('visibility')});
window.addEventListener('pageshow',()=>resumeApp('pageshow'));
window.addEventListener('focus',()=>resumeApp('focus'));
window.addEventListener('online',()=>resumeApp('online'));
setInterval(renderStatus,5000);

/* ---------------- boot ---------------- */
function makeIcon(){if(makeIcon._d)return;makeIcon._d=1;try{const c=document.createElement('canvas');c.width=c.height=180;const x=c.getContext('2d');const g=x.createLinearGradient(0,0,180,180);g.addColorStop(0,'#2A8BE0');g.addColorStop(.6,'#14B087');g.addColorStop(1,'#F2B705');x.fillStyle=g;x.fillRect(0,0,180,180);
  x.strokeStyle='#fff';x.lineWidth=14;x.lineCap='round';x.lineJoin='round';x.beginPath();x.moveTo(30,125);x.lineTo(70,85);x.lineTo(100,108);x.lineTo(150,52);x.stroke();x.fillStyle='#fff';x.beginPath();x.arc(150,52,12,0,7);x.fill();
  const l=document.createElement('link');l.rel='apple-touch-icon';l.href=c.toDataURL('image/png');document.head.appendChild(l);const f=document.createElement('link');f.rel='icon';f.href=l.href;document.head.appendChild(f)}catch(e){}}
async function boot(){
  makeIcon();render();
  if('serviceWorker'in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{})}
  $('#bellDot').classList.toggle('off',!S.settings.notify);
  $('#statusTxt').textContent='Connecting to Binance, Bybit, Gate.io…';
  await Promise.allSettled([bootMeta(),loadFng(),loadCG()]);
  if(!Object.keys(S.meta).length){$('#statusTxt').textContent='No exchange reachable — retrying…';toast('No exchange reachable. Check internet; retrying in 15s',4000);setTimeout(boot,15e3);return}
  await tickAll().catch(e=>logErr('first tick',e));
  sentimentLoop();
  render();
  runScans(false).catch(e=>logErr('first scan',e));
  setTimeout(tickLoop,(S.settings.tickSec||20)*1000);setTimeout(scanLoop,30e3);applyWake()}
window.addEventListener('error',e=>logErr('js',e.error||e.message));
window.addEventListener('unhandledrejection',e=>logErr('promise',e.reason));
boot();
</script>
